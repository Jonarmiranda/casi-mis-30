<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casi mis 30 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-pastel: #f9d5e5;
            --menta-pastel: #d0f4de;
            --olivo-suave: #8a9a86;
            --texto-oscuro: #4a5c48;
            --blanco-trans: rgba(255, 255, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--rosa-pastel), var(--menta-pastel));
            color: var(--texto-oscuro);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--blanco-trans);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 580px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(138, 154, 134, 0.2);
            border: 2px solid white;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--olivo-suave);
            margin-bottom: 10px;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #60745e;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: white;
            border: 2px solid var(--olivo-suave);
            color: var(--olivo-suave);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--olivo-suave);
            color: white;
            transform: translateY(-2px);
        }

        .message-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #556b53;
            border: 1px dashed var(--olivo-suave);
            text-align: left;
            display: none;
        }

        .message-box.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        .preset-photo {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Sección de banderas */
        .flags-section {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .flag-btn {
            background: white;
            border: 2px solid var(--olivo-suave);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .flag-btn:hover,
        .flag-btn.selected {
            background: var(--olivo-suave);
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(138, 154, 134, 0.4);
        }

        /* Apartado para subir/cargar foto propia extra */
        .photo-section {
            margin-bottom: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(138, 154, 134, 0.3);
            text-align: center;
        }

        .photo-section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--olivo-suave);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            display: inline-block;
            background-color: var(--menta-pastel);
            color: var(--texto-oscuro);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .file-upload-label:hover {
            background-color: #b8ebd0;
        }

        .photo-preview {
            margin-top: 15px;
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Botón final sorpresa */
        .btn-final {
            background: linear-gradient(135deg, var(--olivo-suave), #6e826b);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(138, 154, 134, 0.4);
            transition: all 0.3s;
        }

        .btn-final:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .invitation-details {
            display: none;
            margin-top: 25px;
            background: white;
            padding: 22px;
            border-radius: 15px;
            border: 2px solid var(--rosa-pastel);
            animation: fadeIn 0.5s ease-in-out;
            text-align: left;
        }

        .invitation-details h2 {
            color: var(--olivo-suave);
            margin-bottom: 10px;
            font-size: 1.5rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Casi mis 30 ✨</h1>
        <p class="subtitle">Mi semana cumpleañera...</p>

        <div class="btn-group">
            <button class="btn" onclick="mostrarSeccion(1)">💌 ¿No quieres darme un beso?</button>
            <button class="btn" onclick="mostrarSeccion(2)">🌸 ¿Quién va a cumplir 30 añitos?</button>
            <button class="btn" onclick="mostrarSeccion(3)">🍴 ¿Qué se le antoja a la más preciosa del mundo
                mundial?</button>
        </div>

        <!-- Caja de contenido dinámico (Oculta al cargar) -->
        <div class="message-box" id="cajaDinamica">
            <p id="textoDinamico"></p>
        </div>

        <!-- Apartado para subir foto extra opcional -->
        <div class="photo-section">
            <h3>¿Quieres subir otra fotito extra? 📸</h3>
            <label for="subirFoto" class="file-upload-label">📁 Elegir fotito</label>
            <input type="file" id="subirFoto" accept="image/*" onchange="verFoto(event)">
            <img id="vistaPrevia" class="photo-preview" alt="Recuerdo subido">
        </div>

        <!-- Botón para la invitación final -->
        <button class="btn-final" onclick="revelarCena()">🍽️ Ver invitación a la cena</button>

        <div class="invitation-details" id="detalleCena">
            <h2>¡Estás invitada! 💕</h2>
            <p><strong>Cena especial de Cumpleaños</strong></p>
            <p>📅 <strong>Sábado 26 de septiembre</strong></p>
            <p>⏰ <strong>8:00 PM</strong></p>
            <p id="vibeSeleccionadoText" style="margin-top: 10px; font-weight: 600; color: var(--olivo-suave);">🌍 Vibe
                elegida: 🇲🇽 México</p>
            <p style="margin-top: 15px; font-size: 0.95rem; color: #60745e; text-align: center;">¡Prepárate para
                consentirte como te mereces! ❤️</p>
        </div>
    </div>

    <script>
        let banderaElegida = '🇲🇽 México';

        const contenidoBoton = {
            1: {
                texto: "<strong>¿No quieres darme un beso?</strong><br>La neta la neta sí, y lo quiero hacer por el resto de tus cumpleaños."
            },
            2: {
                texto: "<strong>¿Quién va a cumplir 30 añitos?</strong><br>La más preciosa del mundo mundial:",
                htmlExtra: `<img src="nydia.jpeg" class="preset-photo" alt="Nydia">`
            },
            3: {
                texto: "<strong>¿Qué se le antoja a la bella cumpleañera?</strong>",
                htmlExtra: `
                    <div class="flags-section">
                        <button class="flag-btn" onclick="seleccionarBandera('🇧🇷 Brasil', this)">🇧🇷</button>
                        <button class="flag-btn" onclick="seleccionarBandera('🇪🇸 España', this)">🇪🇸</button>
                        <button class="flag-btn" onclick="seleccionarBandera('🇫🇷 Francia', this)">🇫🇷</button>
                        <button class="flag-btn selected" onclick="seleccionarBandera('🇲🇽 México', this)">🇲🇽</button>
                    </div>
                `
            }
        };

        function mostrarSeccion(opcion) {
            const caja = document.getElementById('cajaDinamica');
            const data = contenidoBoton[opcion];
            caja.innerHTML = `<p>${data.texto}</p>` + (data.htmlExtra || '');
            caja.classList.add('active');
        }

        function seleccionarBandera(nombreBandera, elementoBtn) {
            banderaElegida = nombreBandera;
            document.querySelectorAll('.flag-btn').forEach(btn => btn.classList.remove('selected'));
            if (elementoBtn) elementoBtn.classList.add('selected');
            document.getElementById('vibeSeleccionadoText').innerText = `🌍 Vibe elegida: ${banderaElegida}`;
        }

        function verFoto(event) {
            const archivo = event.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function (e) {
                    const img = document.getElementById('vistaPrevia');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                lector.readAsDataURL(archivo);
            }
        }

        function revelarCena() {
            const detalle = document.getElementById('detalleCena');
            document.getElementById('vibeSeleccionadoText').innerText = `🌍 Opción elegida: ${banderaElegida}`;
            detalle.style.display = detalle.style.display === 'block' ? 'none' : 'block';
        }
        // Sin llamada inicial automática para que arranque vacío/oculto
    </script>
</body>

</html>
